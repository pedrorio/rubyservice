schema: spec-driven

context: |
  Ruby library that orders single-character jobs, each with at most one dependency.
  Entry points: OTB::JobsParser.call(string) and OTB::JobsSequencer.call(jobs_hash: hash).
  Both return a Dry::Monads Success or Failure. Keep those results, the error classes, and the error messages unless a change spec says otherwise.
  A job is one word character. The parser extracts pairs shaped like "a =>" or "a => b" (spaces around =>). An empty string is an empty job list. A repeated job keeps the last dependency. Text outside a pair is ignored.
  The sequencer walks the hash in insertion order and builds the sequence by insertion. It is not a linear topological sort. Self-dependency and a dependency chain that returns to the job being checked, or to that job's direct dependency, are failures.
  Ruby 4.0.9. RSpec specs are in spec/. RuboCop lints lib/ only (spec/ and bin/ are excluded).

rules:
  specs:
    - Write requirements with MUST or SHALL and testable WHEN/THEN scenarios.
    - One behaviour per requirement. State only behaviour the parser and sequencer implement today.
    - Do not require a topological order, or cycle detection, for inputs the code does not handle.
